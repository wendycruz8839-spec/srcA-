<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <head>
    <body>
    <script>
        var sueldos = [];
        do
        {
            monto = parseInt(prompt('ingrese sueldo[0 para finalizar] :', ''));
            if (monto>0)
        {
            sueldos.push(monto);
        }
        }while(monto !=0);
        document.write('vertor de sueldos original');
        for(var i=0;i<sueldos.length;i++)
        {
            document.write('<br>'+sueldos[i])
        }
        document.while ('<br> vector de sueldos ordenado');
        //sueldo.sort(); ordenada considerado como texto 
        sueldos.sort(function(v1,v2)
        {
            if(v1>v2)
        {
            return v1-v2;
        }
        });
        for(var i=0;i<sueldos.length;i++)
        {
            document.write('<br>'+sueldos[i])
        }
    </script>
    </body>
    </html>
