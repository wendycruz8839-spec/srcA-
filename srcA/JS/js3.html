<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>If js</title>

    <head>
    <body>
        <p id="x">Saludo</p>
        <script>
            let time = 21
            
            if (time < 10)
        {
            greeting = "Good Morning"
        }
        else if (time < 20)
        {
            greeting = "Good day"
        }
        else 
        {
            greeting = "Good evening"
        }
        let parrafo = document.getElementById("x")
        parrafo.textContent = greeting
        </script>
    </body>
    </html>
